name: Auto Assign Issues

on:
  issues:
    types: [opened]

jobs:
  assign-user:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-assign issue
        uses: pozil/auto-assign-issue@v4
        with:
          assignees: miguelaguero
          numOfAssignee: 1                # 👈 Number of people to randomly pick
          allowSelfAssign: true
